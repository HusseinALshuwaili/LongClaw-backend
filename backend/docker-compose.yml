version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: longclaw
      POSTGRES_PASSWORD: longclaw_dev_password
      POSTGRES_DB: longclaw
    ports:
      - "5432:5432"
    volumes:
      - longclaw_pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://longclaw:longclaw_dev_password@db:5432/longclaw
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ALLOWED_ORIGINS: "*"
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-10}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    ports:
      - "8000:8000"

volumes:
  longclaw_pgdata:
