services:
  - type: web
    name: longclaw-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: longclaw-db
          property: connectionString
      - key: LLM_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: mistralai/Mistral-7B-Instruct-v0.3
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SCAN_INTERVAL_MINUTES
        value: "10"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ENV
        value: production
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1

databases:
  - name: longclaw-db
    plan: starter
    databaseName: longclaw
    user: longclaw
